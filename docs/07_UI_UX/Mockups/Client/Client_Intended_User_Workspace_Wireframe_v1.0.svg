  <text class="gridText" font-weight="700" x="315" y="752">Source</text>
  <text class="gridText" font-weight="700" x="435" y="752">Type</text>
  <text class="gridText" font-weight="700" x="530" y="752">Name / Organization</text>
  <text class="gridText" font-weight="700" x="725" y="752">Relationship</text>
  <text class="gridText" font-weight="700" x="835" y="752">Restrictions</text>
  <text class="gridText" font-weight="700" x="969" y="752">Active</text>
  <text class="gridText" font-weight="700" x="1040" y="752">Actions</text>
  <rect class="surface2" x="244" y="765" width="853" height="52"/>
  <text class="gridText" x="268" y="795">✓</text><text class="gridText" x="315" y="790">Client master</text><text class="gridText" x="315" y="805">CL-000123</text>
  <text class="gridText" x="435" y="795">CLIENT</text><text class="gridText" x="530" y="790">Kent G. Klingler</text><text class="gridText" x="530" y="805">—</text>
  <text class="gridText" x="725" y="795">Client</text><text class="gridText" x="835" y="795">Standard</text><text class="gridText" x="980" y="795">No</text><text class="gridText" x="1040" y="795">Edit · ⋮</text>
  <line class="line2" x1="244" y1="817" x2="1097" y2="817"/>
  <rect class="surface" x="244" y="818" width="853" height="52"/>
  <text class="gridText" x="268" y="848">—</text><text class="gridText" x="315" y="843">Jordan Example</text><text class="gridText" x="315" y="858">Client contact</text>
  <text class="gridText" x="435" y="848">INSURER</text><text class="gridText" x="530" y="843">Acme Specialty Insurance</text><text class="gridText" x="530" y="858">Jordan Example</text>
  <text class="gridText" x="725" y="848">Insurer / agent</text><text class="gridText" x="835" y="848">Policy use only</text><text class="gridText" x="980" y="848">No</text><text class="gridText" x="1040" y="848">Edit · ⋮</text>
  <line class="line2" x1="244" y1="870" x2="1097" y2="870"/>
  <rect class="dash" x="244" y="885" width="853" height="60" rx="3"/>
  <text class="small" x="502" y="914">Add every person or organization expected to rely on the appraisal.</text>
  <text class="tiny" x="536" y="933">Recipients and Nexus system users are separate concepts.</text>
  <circle class="callout" cx="1108" cy="958" r="14"/><text class="calloutText" x="1104" y="963">5</text>

  <!-- Right rail: 6 Guidance -->
  <rect class="surface" x="1137" y="232" width="439" height="345" rx="4"/>
  <rect class="shell" x="1137" y="232" width="439" height="44" rx="4"/>
  <text x="1157" y="260" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#fff">Guidance</text>
  <text class="label" x="1157" y="307">CLIENT</text>
  <text class="small" x="1157" y="327">The party submitting or authorizing the request.</text>
  <line class="line2" x1="1157" y1="342" x2="1552" y2="342"/>
  <text class="label" x="1157" y="370">INTENDED USER</text>
  <text class="small" x="1157" y="390">A person or organization expected to rely on the appraisal.</text>
  <line class="line2" x1="1157" y1="405" x2="1552" y2="405"/>
  <text class="label" x="1157" y="433">RECIPIENT</text>
  <text class="small" x="1157" y="453">Someone authorized to receive a report; not automatically an</text>
  <text class="small" x="1157" y="470">intended user.</text>
  <line class="line2" x1="1157" y1="485" x2="1552" y2="485"/>
  <text class="label" x="1157" y="513">SYSTEM USER</text>
  <text class="small" x="1157" y="533">A Nexus login or staff account; separate from appraisal roles.</text>
  <text class="tiny" x="1157" y="559">Press F1 on a field for contextual help.</text>
  <circle class="callout" cx="1563" cy="564" r="14"/><text class="calloutText" x="1559" y="569">6</text>

  <!-- 7 Validation -->
  <rect class="surface" x="1137" y="592" width="439" height="380" rx="4"/>
  <rect class="shell" x="1137" y="592" width="439" height="44" rx="4"/>
  <text x="1157" y="620" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#fff">Validation</text>
  <rect class="error" x="1157" y="654" width="395" height="92" rx="3"/>
  <text class="errorText" x="1173" y="677">BLOCKING · CIU-005</text>
  <text class="small" x="1173" y="699">At least one active proposed intended user is required</text>
  <text class="small" x="1173" y="716">before acceptance or conversion.</text>
  <text x="1173" y="736" font-family="Segoe UI,Arial" font-size="12" font-weight="700" fill="#8a2e2e">Go to Intended Users →</text>
  <rect class="warn" x="1157" y="760" width="395" height="92" rx="3"/>
  <text class="warnText" x="1173" y="783">WARNING · CIU-014</text>
  <text class="small" x="1173" y="805">The client is not currently identified as an active proposed</text>
  <text class="small" x="1173" y="822">intended user; review is required.</text>
  <text x="1173" y="842" font-family="Segoe UI,Arial" font-size="12" font-weight="700" fill="#755600">Review client status →</text>
  <rect class="surface2 line" x="1157" y="868" width="395" height="74" rx="3"/>
  <text class="label" x="1173" y="892">READINESS SUMMARY</text>
  <text class="small" x="1173" y="914">1 blocking issue · 1 warning · Draft may still be saved</text>
  <circle class="callout" cx="1563" cy="958" r="14"/><text class="calloutText" x="1559" y="963">7</text>

  <!-- Wireframe label -->
  <rect x="1334" y="74" width="242" height="22" rx="11" fill="#dfe8ef"/>
  <text class="tiny" x="1351" y="89">SECTION 10.1 · WIREFRAME v1.0</text>
