  <text class="small" x="700" y="365">jordan@example.com  ·  (719) 555-0142</text>
  <text class="small" x="700" y="385">Preferred method: Email</text>
  <rect class="ghost" x="700" y="402" width="105" height="28" rx="3"/>
  <text class="ghostText" x="718" y="421">Add contact</text>
  <rect class="ghost" x="815" y="402" width="105" height="28" rx="3"/>
  <text class="ghostText" x="833" y="421">Edit contact</text>
  <circle class="callout" cx="1108" cy="429" r="14"/><text class="calloutText" x="1104" y="434">3</text>

  <!-- 4 Intended Use -->
  <rect class="surface" x="224" y="456" width="897" height="202" rx="4"/>
  <rect class="cardHead" x="224" y="456" width="897" height="42" rx="4"/>
  <text class="h2" x="244" y="482">Proposed Intended Use</text>
  <text class="label" x="244" y="521">CATEGORY / DEFINITION</text>
  <rect class="field" x="244" y="531" width="374" height="34" rx="3"/>
  <text class="text" x="257" y="553">Insurance  ›  Insurance placement or renewal</text>
  <text class="label" x="638" y="521">DEFINITION PREVIEW</text>
  <rect class="surface2 line" x="638" y="531" width="459" height="58" rx="3"/>
  <text class="small" x="651" y="551">Establish value to support insurance placement, renewal,</text>
  <text class="small" x="651" y="569">coverage review, or claim-support planning.</text>
  <text class="label" x="244" y="598">CUSTOM NARRATIVE</text>
  <rect class="field" x="244" y="608" width="552" height="34" rx="3"/>
  <text class="small" x="257" y="630">Optional unless the selected definition requires additional wording</text>
  <rect class="warn" x="814" y="604" width="283" height="38" rx="3"/>
  <text class="warnText" x="828" y="621">CONVERSION REVIEW REQUIRED</text>
  <text class="tiny" x="828" y="636">Proposed use is not authoritative until reviewed.</text>
  <circle class="callout" cx="1108" cy="645" r="14"/><text class="calloutText" x="1104" y="650">4</text>

  <!-- 5 Intended Users grid -->
  <rect class="surface" x="224" y="672" width="897" height="300" rx="4"/>
  <rect class="cardHead" x="224" y="672" width="897" height="44" rx="4"/>
