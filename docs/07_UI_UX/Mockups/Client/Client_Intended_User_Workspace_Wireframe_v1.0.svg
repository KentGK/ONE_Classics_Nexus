  <text class="text" x="248" y="162">1967 Chevrolet C10 · Collector Vehicle Appraisal</text>
  <text class="label" x="248" y="190">REQUESTED EFFECTIVE DATE</text>
  <text class="text" x="452" y="190">September 16, 2026 · Date only</text>
  <rect class="badge" x="742" y="121" width="92" height="27" rx="14"/>
  <text class="badgeText" x="768" y="139">DRAFT</text>
  <rect class="warn" x="844" y="121" width="154" height="27" rx="14"/>
  <text class="warnText" x="862" y="139">2 ITEMS TO REVIEW</text>
  <rect class="ghost" x="1185" y="127" width="92" height="34" rx="3"/>
  <text class="ghostText" x="1208" y="149">Validate</text>
  <rect class="ghost" x="1287" y="127" width="92" height="34" rx="3"/>
  <text class="ghostText" x="1317" y="149">Save</text>
  <rect class="button" x="1389" y="127" width="164" height="34" rx="3"/>
  <text class="buttonText" x="1416" y="149">Submit Request →</text>
  <circle class="callout" cx="1549" cy="202" r="14"/><text class="calloutText" x="1545" y="207">1</text>

