<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">ONE Classics Nexus Client and Intended User Workspace Wireframe</title>
  <desc id="desc">Desktop WinForms workspace showing the Appraisal Request header, Client, Client Contact, Proposed Intended Use, Proposed Intended Users, Guidance, and Validation regions defined in DDS section 10.1.</desc>
  <defs>
    <style>
      .bg{fill:#eef2f5}.shell{fill:#0E2841}.shell2{fill:#153a5c}.surface{fill:#fff}.surface2{fill:#f7f9fb}.line{stroke:#b9c5cf;stroke-width:1.3}.line2{stroke:#d6dee5;stroke-width:1}.nav{font:600 15px 'Segoe UI',Arial,sans-serif;fill:#dce8f2}.navActive{font:700 15px 'Segoe UI',Arial,sans-serif;fill:#fff}.brand{font:700 22px 'Segoe UI',Arial,sans-serif;fill:#fff}.brandSub{font:12px 'Segoe UI',Arial,sans-serif;fill:#c4d4e2}.h1{font:700 24px 'Segoe UI',Arial,sans-serif;fill:#16324a}.h2{font:700 16px 'Segoe UI',Arial,sans-serif;fill:#17334c}.label{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#526575}.text{font:14px 'Segoe UI',Arial,sans-serif;fill:#20384c}.small{font:12px 'Segoe UI',Arial,sans-serif;fill:#637684}.tiny{font:11px 'Segoe UI',Arial,sans-serif;fill:#667987}.button{fill:#0E2841}.buttonText{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#fff}.ghost{fill:#fff;stroke:#8ba0b2;stroke-width:1.2}.ghostText{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#24445f}.field{fill:#fff;stroke:#aebdca;stroke-width:1.2}.badge{fill:#e7f1fa;stroke:#7da7c7;stroke-width:1}.badgeText{font:700 12px 'Segoe UI',Arial,sans-serif;fill:#1c557e}.warn{fill:#fff4d6;stroke:#e2b54b;stroke-width:1}.warnText{font:700 12px 'Segoe UI',Arial,sans-serif;fill:#7f5b00}.error{fill:#fff0f0;stroke:#d96f6f;stroke-width:1}.errorText{font:700 12px 'Segoe UI',Arial,sans-serif;fill:#9a2f2f}.ok{fill:#e8f6ed;stroke:#70aa82;stroke-width:1}.okText{font:700 12px 'Segoe UI',Arial,sans-serif;fill:#2f7045}.cardHead{fill:#edf3f7}.gridHead{fill:#dfe8ef}.gridText{font:11px 'Segoe UI',Arial,sans-serif;fill:#294054}.callout{fill:#0E2841}.calloutText{font:700 12px 'Segoe UI',Arial,sans-serif;fill:#fff}.dash{stroke:#8ba0b2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
    </style>
  </defs>

  <rect class="bg" width="1600" height="1000"/>

  <!-- Nexus shell -->
  <rect class="shell" x="0" y="0" width="1600" height="62"/>
  <text class="brand" x="28" y="31">ONE CLASSICS NEXUS</text>
  <text class="brandSub" x="29" y="49">APPRAISAL WORKFLOW PLATFORM</text>
  <text class="nav" x="1260" y="36">Appraiser: Kent G. Klingler</text>
  <circle cx="1548" cy="31" r="17" fill="#dce8f2"/>
  <text x="1542" y="36" font-family="Segoe UI,Arial" font-size="14" font-weight="700" fill="#0E2841">KG</text>

  <rect class="shell2" x="0" y="62" width="208" height="938"/>
  <text class="nav" x="28" y="112">⌂  Dashboard</text>
  <text class="nav" x="28" y="158">▣  Vehicles</text>
  <rect x="0" y="181" width="208" height="48" fill="#245a84"/>
  <rect x="0" y="181" width="5" height="48" fill="#71b6e6"/>
  <text class="navActive" x="28" y="211">▤  Appraisal Requests</text>
  <text class="nav" x="28" y="260">◇  Appraisals</text>
  <text class="nav" x="28" y="306">✓  Inspections</text>
  <text class="nav" x="28" y="352">≋  Comparables</text>
  <text class="nav" x="28" y="398">∑  Valuation</text>
  <text class="nav" x="28" y="444">▧  Reports</text>
