  <text class="label" x="244" y="297">SEARCH OR SELECT CLIENT</text>
  <rect class="field" x="244" y="306" width="397" height="34" rx="3"/>
  <text class="text" x="257" y="328">CL-000123  ·  Kent G. Klingler</text>
  <text class="label" x="244" y="365">CLIENT SUMMARY</text>
  <text class="text" x="244" y="387">Person · Active · Colorado Springs, CO</text>
  <rect class="ghost" x="244" y="402" width="107" height="28" rx="3"/>
  <text class="ghostText" x="261" y="421">Open client</text>
  <rect class="ghost" x="361" y="402" width="118" height="28" rx="3"/>
  <text class="ghostText" x="376" y="421">Change client</text>
  <circle class="callout" cx="652" cy="429" r="14"/><text class="calloutText" x="648" y="434">2</text>

  <!-- 3 Client Contact -->
  <rect class="surface" x="680" y="232" width="441" height="210" rx="4"/>
  <rect class="cardHead" x="680" y="232" width="441" height="42" rx="4"/>
